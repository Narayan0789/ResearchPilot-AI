services:
  - type: web
    name: researchpilot-ai
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: tavily
